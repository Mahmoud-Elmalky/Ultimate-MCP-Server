[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ultimate-mcp-server"
version = "2.0.0a0"
description = "A modular, secure, resource-conscious MCP server for local AI models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ultimate MCP Server contributors" }]
dependencies = [
  "mcp[cli]>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
research = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "tavily-python>=0.5"]
market = ["yfinance>=0.2"]
youtube = ["google-api-python-client>=2", "youtube-transcript-api>=1"]
browser = ["playwright>=1.50,<2"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1.0,<2"]
data = ["pandas>=2.2,<4", "numpy>=2,<3", "openpyxl>=3.1,<4"]
system = ["psutil>=6,<8"]
media = ["Pillow>=11,<13"]
embeddings = []
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "types-beautifulsoup4"]

[project.scripts]
ultimate-mcp = "ultimate_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# This is a starting proposal. The coding agent must verify current package releases,
# platform support, SDK APIs, licensing, and dependency compatibility before locking.
